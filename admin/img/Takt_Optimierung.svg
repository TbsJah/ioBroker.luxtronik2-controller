<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" style="background:#ffffff; font-family:Arial, sans-serif; border: 1px solid #e0e0e0; border-radius: 8px;">
    
    <!-- Überschrift -->
    <text x="450" y="30" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">Funktionsweise: Intelligente Takt-Optimierung</text>
    <text x="450" y="50" font-size="13" font-weight="bold" fill="#666" text-anchor="middle">How it works: Intelligent Cycle Optimization</text>
    
    <!-- Zeitachse unten -->
    <line x1="50" y1="390" x2="850" y2="390" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc" />
        </marker>
    </defs>
    <text x="850" y="410" font-size="12" fill="#888888" text-anchor="end">Zeitlicher Ablauf / Timeline</text>

    <!-- ZEILE 1: Verdichter (Y = 70 to 110) -->
    <text x="50" y="65" font-size="13" font-weight="bold" fill="#555555">Verdichter / Compressor</text>
    
    <rect x="50" y="75" width="90" height="40" fill="#f5f5f5" rx="4" stroke="#e0e0e0"/>
    <text x="95" y="95" font-size="11" font-weight="bold" fill="#9e9e9e" text-anchor="middle">AUS / OFF</text>
    
    <rect x="140" y="75" width="580" height="40" fill="#4caf50" rx="4"/>
    <text x="430" y="93" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">EIN (Läuft nahtlos in einem einzigen durchgehenden Takt)</text>
    <text x="430" y="108" font-size="11" fill="#ffffff" text-anchor="middle">ON (Runs seamlessly in a single continuous cycle)</text>
    
    <rect x="720" y="75" width="130" height="40" fill="#f5f5f5" rx="4" stroke="#e0e0e0"/>
    <text x="785" y="95" font-size="11" font-weight="bold" fill="#9e9e9e" text-anchor="middle">AUS / OFF</text>

    <!-- ZEILE 2: Anlagen-Modus (Y = 145 to 185) -->
    <text x="50" y="140" font-size="13" font-weight="bold" fill="#555555">Anlagen-Modus / System Mode (3-Way Valve)</text>
    
    <rect x="50" y="150" width="90" height="40" fill="#f5f5f5" rx="4" stroke="#e0e0e0"/>
    <text x="95" y="174" font-size="11" fill="#9e9e9e" text-anchor="middle">Leerlauf / Idle</text>
    
    <rect x="140" y="150" width="220" height="40" fill="#bbdefb" rx="4"/>
    <text x="250" y="174" font-size="13" fill="#1976d2" font-weight="bold" text-anchor="middle">Heizen / Heating</text>
    
    <rect x="360" y="150" width="160" height="40" fill="#ffcdd2" rx="4"/>
    <text x="440" y="174" font-size="13" fill="#d32f2f" font-weight="bold" text-anchor="middle">Warmwasser / DHW</text>
    
    <rect x="520" y="150" width="200" height="40" fill="#bbdefb" rx="4"/>
    <text x="620" y="167" font-size="13" fill="#1976d2" font-weight="bold" text-anchor="middle">Heizen / Heating</text>
    <text x="620" y="182" font-size="10" fill="#1976d2" text-anchor="middle">RL auf 35°C (opt.) / Return 35°C (opt.)</text>

    <rect x="720" y="150" width="130" height="40" fill="#f5f5f5" rx="4" stroke="#e0e0e0"/>
    <text x="785" y="174" font-size="11" fill="#9e9e9e" text-anchor="middle">Leerlauf / Idle</text>

    <!-- ZEILE 3: Adapter Events (Y = 220+) -->
    <text x="50" y="225" font-size="13" font-weight="bold" fill="#555555">Eingriffe durch den ioBroker Adapter / Adapter Interventions</text>
    
    <!-- Event 1 -->
    <circle cx="140" cy="255" r="6" fill="#ff9800"/>
    <line x1="140" y1="255" x2="140" y2="115" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="150" y="250" font-size="12" font-weight="bold" fill="#e65100">1. Takt-Kopplung startet</text>
    <text x="150" y="265" font-size="11" font-weight="bold" fill="#e65100">1. Cycle coupling starts</text>
    <text x="150" y="282" font-size="11" fill="#555555">WW kühlt ab. Adapter hebt RL-Soll auf 35°C</text>
    <text x="150" y="296" font-size="11" fill="#555555">DHW cools. Adapter raises return target to 35°C</text>

    <!-- Event 2 -->
    <circle cx="360" cy="335" r="6" fill="#757575"/>
    <line x1="360" y1="335" x2="360" y2="195" stroke="#757575" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="370" y="330" font-size="12" font-weight="bold" fill="#424242">2. Warmwasser</text>
    <text x="370" y="345" font-size="11" font-weight="bold" fill="#424242">2. Hot Water (DHW)</text>
    <text x="370" y="362" font-size="11" fill="#555555">Natürlicher WW-Startwert erreicht</text>
    <text x="370" y="376" font-size="11" fill="#555555">Natural DHW start threshold reached</text>
    
    <!-- Event 3 -->
    <circle cx="520" cy="255" r="6" fill="#ff9800"/>
    <line x1="520" y1="255" x2="520" y2="195" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="530" y="250" font-size="12" font-weight="bold" fill="#e65100">3. Heizen nach WW</text>
    <text x="530" y="265" font-size="11" font-weight="bold" fill="#e65100">3. Heating after DHW</text>
    <text x="530" y="282" font-size="11" fill="#555555">WW fertig. Optional: RL-Soll auf 35°C</text>
    <text x="530" y="296" font-size="11" fill="#555555">DHW finished. Optional: Return target 35°C</text>

    <!-- Event 4 -->
    <circle cx="720" cy="255" r="6" fill="#ff9800"/>
    <line x1="720" y1="255" x2="720" y2="115" stroke="#ff9800" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="730" y="250" font-size="12" font-weight="bold" fill="#e65100">4. Leerlauf (Schutz)</text>
    <text x="730" y="265" font-size="11" font-weight="bold" fill="#e65100">4. Idle (Protection)</text>
    <text x="730" y="282" font-size="11" fill="#555555">Standardwerte resettet</text>
    <text x="730" y="296" font-size="11" fill="#555555">Default values restored</text>
    
</svg>
